[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zbus-architect"
version = "0.1.0"
description = "Visual architect and code generator for Zephyr zbus"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ankit Modi", email = "ankit.5036@gmail.com" }]
readme = "README.md"
dependencies = [
    "pydantic>=2.0",
    "jinja2>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "click>=8.1",
    "libclang>=16.0",
]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
zbus-architect = "zbus_architect.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
